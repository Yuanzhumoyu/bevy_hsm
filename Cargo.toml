[package]
name = "bevy_hsm"
version = "0.19.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A hierarchical and finite state machine library for the Bevy game engine."
repository = "https://github.com/Yuanzhumoyu/bevy_hsm"
keywords = ["bevy", "hsm", "fsm", "state-machine", "ecs"]
include = ["/src", "/crates", "/examples", "/tests"]
readme = "README.md"

[workspace]
members = [".", "crates/bevy_hsm_macros"]
resolver = "2"

[features]
default = ["hybrid", "history", "state_data"]
hybrid = ["hsm", "fsm", "bevy_hsm_macros/hybrid"]
state_data = ["bevy_hsm_macros/state_data"]
history = ["bevy_hsm_macros/history"]
fsm = [
  "dep:dyn-clone",
  "dep:dyn-eq",
  "dep:dyn-hash",
  "dep:bimap",
  "bevy_hsm_macros/fsm",
]
hsm = ["bevy_hsm_macros/hsm"]

[dependencies]
bevy_hsm_macros = { version = "0.1.0", path = "crates/bevy_hsm_macros", optional = true }
bevy = { version = "0.19.0-rc.1", default-features = false, features = [
  "bevy_asset",
  "bevy_scene",
  "bevy_log",
  "debug"
] }
smallvec = "1.15.1"
dyn-clone = { version = "1.0.20", optional = true }
dyn-eq = { version = "0.1.3", optional = true }
dyn-hash = { version = "1.0.0", optional = true }
bimap = { version = "0.6.3", optional = true }

[dev-dependencies]
bevy = { version = "0.19.0-rc.1", default-features = false, features = [
  "bevy_feathers",
  "bevy_log",
  "ui",
] }

[workspace.lints.clippy]
type_complexity = "allow"

[[example]]
name = "guarded_counter"
path = "examples/guarded_counter.rs"
required-features = ["hsm", "history"]

[[example]]
name = "flashing_light"
path = "examples/flashing_light.rs"
required-features = ["hsm", "history"]

[[example]]
name = "deep_chain"
path = "examples/deep_chain.rs"
required-features = ["hsm", "history"]

[[example]]
name = "simple_fsm"
path = "examples/simple_fsm.rs"
required-features = ["fsm", "history"]

[[example]]
name = "macros_hsm"
path = "examples/macros/hsm.rs"
required-features = ["hsm", "history", "state_data"]

[[example]]
name = "macros_fsm"
path = "examples/macros/fsm.rs"
required-features = ["fsm", "state_data"]

[[example]]
name = "character_controller"
path = "examples/character_controller.rs"
required-features = ["hsm"]

[[example]]
name = "vending_machine"
path = "examples/vending_machine.rs"
required-features = ["fsm", "history"]

[[example]]
name = "calculator"
path = "examples/calculator.rs"
required-features = ["hybrid", "history"]

[[example]]
name = "hello_hsm"
path = "examples/hello_hsm.rs"
required-features = ["hsm"]

[[example]]
name = "guard_hsm"
path = "examples/guard_hsm.rs"
required-features = ["hsm"]

[[example]]
name = "interrupt_hsm"
path = "examples/interrupt_hsm.rs"
required-features = ["hsm", "history"]

[[example]]
name = "event_fsm"
path = "examples/event_fsm.rs"
required-features = ["fsm"]

[[test]]
name = "action_system"
path = "tests/action_system.rs"
required-features = ["hybrid", "history"]

[[test]]
name = "event"
path = "tests/event.rs"
required-features = ["fsm", "hsm"]
