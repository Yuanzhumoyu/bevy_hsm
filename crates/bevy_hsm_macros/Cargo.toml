[package]
name = "bevy_hsm_macros"
version = "0.20.0"
edition = "2024"
description = "Procedural macros for bevy_hsm: declarative HSM/FSM definitions for the Bevy game engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yuanzhumoyu/bevy_hsm"
readme = "README.md"
keywords = ["bevy", "hsm", "fsm", "state-machine", "macros"]
categories = ["game-development"]
include = ["/src", "/README.md"]

[lib]
name = "bevy_hsm_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["extra-traits", "full"] }

[features]
hybrid = ["hsm", "fsm"]
state_data = []
history = []
fsm = []
hsm = []
